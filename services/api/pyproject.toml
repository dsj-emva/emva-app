[project]
name = "emva-api"
version = "0.1.0"
description = "Emva service: the API the screens use, and all domain logic behind it"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "boto3>=1.43.106",
    "fastapi>=0.142.2",
    "phonenumbers>=9.0.40",
    "psycopg[binary]>=3.3.6",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.1",
    "tzdata>=2026.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
emva-openapi = "emva_api.openapi:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
